# Render Blueprint: GitHub repo'ni ulab, "New > Blueprint" orqali bir bosishda deploy qilinadi.
databases:
  - name: booking-db
    plan: free
    databaseName: booking
    user: booking
    postgresMajorVersion: "16"

services:
  - type: web
    name: booking-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: booking-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: SEED_DEMO           # har deployda demo ma'lumotlar (idempotent)
        value: "1"
      - key: DEMO_PASSWORD
        sync: false              # Render panelida o'zingiz kiritasiz
      - key: WEB_CONCURRENCY
        value: "2"
